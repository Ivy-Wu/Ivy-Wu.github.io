<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pop Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap');
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:42px 20px 64px;
  background:#fbfaf6;color:#17264d;
  font-family:"Nunito","Arial Rounded MT Bold",sans-serif;
  display:flex;justify-content:center
}
.quiz{width:min(700px,100%)}
.header-wrap{text-align:center;margin-bottom:30px}
.header-img{width:min(520px,92%);height:auto;display:inline-block}
.subhead{font-size:22px;margin-top:2px;color:#53617f}

.question{margin-bottom:33px}
.question-title{font-size:23px;font-weight:700;margin-bottom:12px;letter-spacing:.1px}
.hint{font-size:18px;font-weight:400}

input[type=text]{
  width:100%;padding:11px 14px;border:2px solid #17264d;border-radius:13px;
  background:#fff;font:inherit;font-size:21px;outline:none;color:#17264d
}
input[type=text]:focus{box-shadow:3px 3px 0 #bddcf4}

.options{display:flex;flex-wrap:wrap;gap:10px}
.option input{position:absolute;opacity:0;pointer-events:none}
.option span{
  display:inline-block;padding:8px 15px;border:2px solid #17264d;border-radius:999px;
  background:#fff;font-size:18px;font-weight:600;cursor:pointer;transition:.12s ease
}
.option span:hover{transform:translateY(-2px) rotate(-1deg)}
.option input:checked + span{
  background:#dceefe;box-shadow:3px 3px 0 #17264d;transform:translate(-1px,-1px)
}

button{
  display:block;margin:45px auto 0;padding:11px 34px;border:2px solid #17264d;
  border-radius:999px;background:#17264d;color:white;font:inherit;
  font-size:22px;font-weight:700;cursor:pointer
}
button:hover{transform:rotate(-1deg) scale(1.03)}
#message{min-height:28px;margin-top:18px;text-align:center;font-size:20px}
</style>
</head>

    <label class="option"><input type="radio" name="coffeeRatio" value="85/15"><span>85% ☕️ / 15% 🍼</span></label>
    <label class="option"><input type="radio" name="coffeeRatio" value="75/25"><span>75% ☕️ / 25% 🍼</span></label>
    <label class="option"><input type="radio" name="coffeeRatio" value="0/100"><span>0% ☕️ / 100% 🍼</span></label>
  </div>
</section>

<section class="question">
  <div class="question-title">
    6. What color would Ivy pick for her light saber?
    <span class="hint">(hint: multiple choice)</span>
  </div>
  <div class="options">
    <label class="option"><input type="checkbox" name="lightsaber" value="blue"><span>Blue</span></label>
    <label class="option"><input type="checkbox" name="lightsaber" value="red"><span>Red</span></label>
    <label class="option"><input type="checkbox" name="lightsaber" value="green"><span>Green</span></label>
  </div>
</section>

<button type="submit">Submit</button>
<div id="message"></div>
</form>
</main>

<script>
/*
  GAME DATA DESIGN

  Q1 + Q2 are kept as direct player/game variables:
    codeName
    surface

  Q3-Q6 contribute to one tally called quizScore.

  Change the numbers below whenever you decide how much each answer
  should be worth. The rest of the game does not need to change.
*/
const SCORE_MAP = {
  venus: {
    shorter: 0,
    longer: 1
  },
  ivyNumber: {
    "3": 0,
    "42": 1,
    "127": 2,
    "tree(3)": 3
  },
  coffeeRatio: {
    "100/0": 0,
    "85/15": 3,
    "75/25": 2,
    "0/100": 1
  },
  lightsaber: {
    blue: 1,
    red: 1,
    green: 1
  }
};

document.getElementById("quizForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const data = new FormData(e.target);
  const codeName = data.get("codeName").trim();
  const surface = data.get("surface");

  const answers = {
    venus: data.get("venus"),
    ivyNumber: data.get("ivyNumber"),
    coffeeRatio: data.get("coffeeRatio"),
    lightsaber: data.getAll("lightsaber")
  };

  let quizScore = 0;
  quizScore += SCORE_MAP.venus[answers.venus] ?? 0;
  quizScore += SCORE_MAP.ivyNumber[answers.ivyNumber] ?? 0;
  quizScore += SCORE_MAP.coffeeRatio[answers.coffeeRatio] ?? 0;

  answers.lightsaber.forEach(color => {
    quizScore += SCORE_MAP.lightsaber[color] ?? 0;
  });

  const gameSetup = {
    codeName,
    surface,
    quizAnswers: answers,
    quizScore
  };

  // Available to the tennis game immediately after this quiz.
  sessionStorage.setItem("tennisGameSetup", JSON.stringify(gameSetup));

  console.log("Tennis game setup:", gameSetup);

  document.getElementById("message").textContent =
    "Answers locked in, " + codeName + ". 🎾";
});
</script>
</body>
</html>
